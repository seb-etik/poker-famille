# Quinoa installe Node lui-même : rien à préinstaller, ni en local ni dans Docker
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.21.0
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/ws,/q,/api
# en dev, Quinoa lance Vite et fait proxy (rechargement à chaud)
quarkus.quinoa.dev-server.port=5173
# lance aussi les tests Vitest du front pendant ./mvnw package
quarkus.quinoa.run-tests=true
# les cartes SVG se compressent très bien (environ 3 fois plus légères)
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
# Cache : index.html (et les routes SPA) revalidé à chaque fois pour que les mises à jour arrivent tout de suite ;
# fichiers Vite nommés avec un hash, gardés un an ; cartes gardées une semaine
quarkus.http.filter.revalidate.header."Cache-Control"=no-cache
quarkus.http.filter.revalidate.matches=/(?!assets/|themes/).*
quarkus.http.filter.hashed-assets.header."Cache-Control"=public, max-age=31536000, immutable
quarkus.http.filter.hashed-assets.matches=/assets/.+
quarkus.http.filter.themes.header."Cache-Control"=public, max-age=604800
quarkus.http.filter.themes.matches=/themes/.+
