apiVersion: apps/v1
kind: Deployment
metadata:
  name: poker-famille
  namespace: sbu
  labels:
    app: poker-famille
spec:
  # Tables live in memory: a second pod would have its own tables.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: poker-famille
  template:
    metadata:
      labels:
        app: poker-famille
    spec:
      containers:
        - name: poker-famille
          image: ghcr.io/seb-etik/poker-famille:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
